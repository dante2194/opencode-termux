name: Build arm64-v8a APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build the arm64-v8a debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept the Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install the Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "ndk;29.0.14206865" || \
            echo "The SDK components could not be installed, the Gradle build downloads them if needed."

      - name: Build the arm64-v8a APK
        shell: bash {0}
        env:
          # Only build for arm64-v8a, this makes the build much faster.
          TERMUX_BUILD_ABIS: arm64-v8a
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "0"
          TERMUX_APP_NAME: OpenCode Termux
        run: |
          ./gradlew assembleDebug --stacktrace

          echo "Built APKs:"
          ls -la app/build/outputs/apk/debug/

      - name: Attach the APK
        uses: actions/upload-artifact@v6
        with:
          name: opencode-termux-arm64-v8a-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
